<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>

  <!-- Fox Ears -->
  <polygon points="20,15 35,45 10,40" fill="#E64A19" />
  <polygon points="80,15 65,45 90,40" fill="#E64A19" />
  <polygon points="24,22 34,42 16,38" fill="#FFE0B2" />
  <polygon points="76,22 66,42 84,38" fill="#FFE0B2" />

  <!-- Fox Face Outline -->
  <polygon points="50,65 15,35 50,22 85,35" fill="url(#foxGrad)" />
  <polygon points="50,65 30,42 50,28 70,42" fill="#FF7043" />
  <polygon points="50,65 36,52 64,52" fill="#FFFFFF" />

  <!-- Fox Eyes & Nose -->
  <circle cx="38" cy="42" r="3" fill="#212121" />
  <circle cx="62" cy="42" r="3" fill="#212121" />
  <polygon points="50,65 46,59 54,59" fill="#212121" />

  <!-- Multi-Pipe / Endpoints Network Paths -->
  <!-- Pipe 1 -->
  <path d="M 50,68 C 50,78 25,75 25,88" fill="none" stroke="url(#pipeGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="25" cy="90" r="5" fill="#4CAF50"/>

  <!-- Pipe 2 -->
  <path d="M 50,68 C 50,78 50,80 50,88" fill="none" stroke="url(#pipeGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="90" r="5" fill="#00BCD4"/>

  <!-- Pipe 3 -->
  <path d="M 50,68 C 50,78 75,75 75,88" fill="none" stroke="url(#pipeGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="75" cy="90" r="5" fill="#FF9800"/>
</svg>
